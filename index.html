<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#FFFFFF">
<title>Банки задач</title>
<!-- Банки задач: задачи одной темы из многих источников, банк за раз,
     с фильтром по источнику. Что показывать, задаёт адрес: #parametr —
     банк, #parametr/ommo — банк, только ОММО. Данные — data/banki.json,
     его пишет скрипт выкладки из файлов банка в knowledge. -->
<!-- Логотип «Фасад» (02.11.2026): фронтон с пустым тимпаном, архитрав,
     четыре колонны, две ступени основания — банк в прямом смысле. Один
     чёрный цвет, без подложки и без надписи рядом, как у 11-1 и сайта
     курса. Выбран из четырёх: «Картотека», «Стопка», «Семейство»,
     «Фасад». Значок вкладки — тот же рисунок, но архитрав и колонны
     толще: в 16 точках тонкие сливаются. На тёмной вкладке он белеет —
     чёрный там пропал бы. Иконки для домашнего экрана — рисунок
     на белом квадрате; маскируемая — мельче, чтобы его не обрезал круг. -->
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=2">
<!-- Манифест — для Android, как у 11-1 и сайта курса: без него Chrome
     при «Добавить на главный экран» берёт имя и иконку наугад. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="assets/fonts/golos-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<!-- KaTeX — формулы условий, та же версия, что на «Лучезарности». -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="assets/style.css?v=4">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <!-- Слева логотип сайта, справа знак «Лучезарности», ни слова рядом —
         как на 11-1 и сайте курса. «Фасад» неподвижен и потому не кнопка;
         знак — кнопка: нажатие запускает вспышку лучей, страница
         не перезагружается. Рисунки встроены в разметку: приходят вместе
         со страницей и не мигают пустым местом. -->
    <span class="logo fasad-logo">
      <!-- Тот же рисунок, что assets/logo.svg. Поле обрезано по самому
           рисунку (5–95): в квадрате 0–100 он выходил бы мельче знака. -->
      <svg class="brand-logo fasad" viewBox="5 5 90 90" aria-hidden="true" focusable="false">
        <path fill="#141118" fill-rule="evenodd" d="M10 34 50 10 90 34Z M27 30.5 73 30.5 50 17Z"/>
        <g fill="#141118">
          <rect x="14" y="38" width="72" height="6"/>
          <rect x="19" y="48" width="8" height="32"/>
          <rect x="35.7" y="48" width="8" height="32"/>
          <rect x="56.3" y="48" width="8" height="32"/>
          <rect x="73" y="48" width="8" height="32"/>
          <rect x="12" y="83" width="76" height="5"/>
          <rect x="8" y="90" width="84" height="4.5"/>
        </g>
      </svg>
    </span>
    <h1 class="sr-only">Банки задач — задачи одной темы из многих источников</h1>
    <button class="logo znak-btn" type="button" aria-label="Лучезарность">
      <svg class="brand-logo znak" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <circle cx="50" cy="50" r="50" fill="#000"/>
        <g class="znak-rays" stroke="#FDD17A" stroke-width="2.6">
          <line x1="50.0" y1="57.0" x2="50.0" y2="90.0"/>
          <line x1="56.1" y1="53.5" x2="84.6" y2="70.0"/>
          <line x1="57.0" y1="50.0" x2="80.0" y2="50.0"/>
          <line x1="56.1" y1="46.5" x2="84.6" y2="30.0"/>
          <line x1="53.5" y1="43.9" x2="65.0" y2="24.0"/>
          <line x1="50.0" y1="43.0" x2="50.0" y2="10.0"/>
          <line x1="46.5" y1="43.9" x2="35.0" y2="24.0"/>
          <line x1="43.9" y1="46.5" x2="15.4" y2="30.0"/>
          <line x1="43.0" y1="50.0" x2="20.0" y2="50.0"/>
          <line x1="43.9" y1="53.5" x2="15.4" y2="70.0"/>
        </g>
        <polygon points="50.0,50.0 61.5,76.3 73.0,89.8 67.0,73.1" fill="#fff"/>
        <polygon points="50.0,50.0 33.0,73.1 27.0,89.8 38.5,76.3" fill="#fff"/>
        <circle cx="50" cy="50" r="4.5" fill="#fff"/>
      </svg>
    </button>
  </header>

  <main id="main">
    <div class="skeleton" aria-hidden="true">
      <span class="skel-head"></span>
      <span class="skel-row"></span>
      <span class="skel-row"></span>
    </div>
  </main>
</div>
<!-- marked разбирает markdown условий, KaTeX — формулы в них. Не загрузятся —
     условия покажутся простым текстом с формулами в исходном виде. -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="assets/bank.js?v=3"></script>
</body>
</html>
